name: Improve Celest Learn
description: Report a correction, missing topic, source suggestion, or retrieval result
title: "Learn: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve the reviewed Learn corpus.

        Please do not include credentials, private tenant data, customer content, or other secrets. We review suggestions before they become published guidance.
  - type: dropdown
    id: feedback-type
    attributes:
      label: What would you like to improve?
      options:
        - Correct a published passage
        - Suggest a missing topic
        - Suggest a source or citation
        - Report an MCP retrieval result
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Tell us what should change or what you expected to find.
      placeholder: A short description of the gap, correction, or result.
    validations:
      required: true
  - type: input
    id: canonical-url
    attributes:
      label: Canonical Learn URL (optional)
      description: Link the article or MCP resource if one is involved.
      placeholder: https://celest.dev/learn/agent-estate-review
  - type: textarea
    id: question
    attributes:
      label: Question or query (optional)
      description: Paste the complete question you asked, including the MCP tool and endpoint if relevant.
      placeholder: What is an Agent Estate Review, and what evidence does it collect?
  - type: textarea
    id: evidence
    attributes:
      label: Passage or evidence (optional)
      description: Share the relevant passage, citation, source URL, or expected answer. A source digest is helpful but not required.
      placeholder: Include only public material. Remove private tenant data and secrets.
